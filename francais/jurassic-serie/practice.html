<head>

<style>
:root{--bg:#0b1710;--bg2:#12251a;--panel:#162c1f;--line:#26452f;--text:#e9f0e4;--mute:#97ad9b;--amber:#e3a43a;--amber2:#f6c35c;--ok:#62d487;--bad:#ee6a5f;--half:#e8c15a;--m:#6db0ff;--f:#ff7f93;--r:14px}
[hidden]{display:none!important}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:radial-gradient(1200px 600px at 50% -200px,#1d3d27 0,var(--bg) 70%) fixed,var(--bg);color:var(--text);font:18px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100vh;padding-bottom:84px}
#top{position:sticky;top:0;z-index:5;background:rgba(11,23,16,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top)) 16px 0}
#top .row{display:flex;align-items:center;gap:12px;max-width:720px;margin:0 auto;padding-bottom:7px}
#pauseBtn{background:var(--panel);color:var(--amber);border:1px solid var(--line);border-radius:10px;font-size:18px;width:42px;height:38px;cursor:pointer}
#info{flex:1;font-size:15px;color:var(--mute)}#info b{color:var(--amber2)}#info .sp{color:var(--bad)}
#meter{height:3px;background:var(--line);margin:0 -16px}#bar{height:3px;width:0;background:linear-gradient(90deg,#3f9b5b,var(--amber));transition:width .3s}
.card{max-width:720px;margin:18px auto 0;padding:20px 16px 8px}
.head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.tt{color:var(--mute);font-size:13px;text-transform:uppercase;letter-spacing:.08em}.retry{font-size:12px;color:var(--bg);background:var(--amber);border-radius:8px;padding:1px 8px}
.chip{display:inline-block;font-size:13px;font-weight:600;padding:2px 10px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.ch-ellie{color:#6fd68c}.ch-alan{color:#e3a43a}.ch-malcolm{color:#f2796d}.ch-hammond{color:#8cc3ea}.ch-owen{color:#f0954a}.ch-claire{color:#c39cf0}.ch-ashok{color:#58d1c1}
.sub{color:var(--mute);font-size:15px;margin:6px 0}.en{font-style:italic}
.prompt{margin:10px 0 14px}.big{font-size:24px;line-height:1.5}.prompt.wrong{color:#f5b3ac}.say{color:var(--amber);font-weight:600}
.pl{color:var(--amber2);font-weight:600;margin-right:6px}.blk{color:var(--amber)}
input.ans,input.inl{font:inherit;color:var(--text);background:var(--bg2);border:2px solid var(--line);border-radius:12px;padding:10px 12px;outline:none;font-size:20px}
input.ans{width:100%;margin:6px 0 4px}input.inl{display:inline-block;width:9.5em;max-width:100%;padding:3px 10px;margin:0 3px;font-size:inherit;vertical-align:baseline;text-align:center}
input:focus{border-color:var(--amber);box-shadow:0 0 0 3px rgba(227,164,58,.18)}input:disabled{opacity:.8}
.btn{font:inherit;font-size:17px;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 16px;cursor:pointer;min-height:46px}
.btn.primary,.btn:not(.ghost):not(.g1):not(.g2):not(.g3):not(.g4){background:#1f4a2c;border-color:#2e7a45}
.btn.ghost{background:transparent;color:var(--mute)}.btn:hover{border-color:var(--amber)}
kbd{font:12px ui-monospace,Menlo,monospace;color:var(--mute);border:1px solid var(--line);border-radius:5px;padding:0 5px;margin-left:6px;background:rgba(0,0,0,.25)}
.choice kbd,.tile kbd{margin:0 8px 0 0}
.acts,.fbtn{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}.fbtn{margin-top:16px}
.choices{display:grid;gap:10px;margin:8px 0}.choices.row{grid-template-columns:repeat(3,1fr)}
.choice{text-align:left;font:inherit;font-size:19px;color:var(--text);background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;min-height:50px}
.choice:hover:not(:disabled){border-color:var(--amber)}.choice.right{border-color:var(--ok);background:rgba(98,212,135,.14)}.choice.wrong{border-color:var(--bad);background:rgba(238,106,95,.14)}.choice:disabled{cursor:default;color:var(--text)}
.hint{background:rgba(227,164,58,.1);border-left:3px solid var(--amber);padding:8px 12px;border-radius:8px;margin:8px 0;font-size:16px}
.fbhead{font-size:22px;font-weight:700;margin:14px 0 4px}.fbhead.ok{color:var(--ok)}.fbhead.half{color:var(--half)}.fbhead.bad{color:var(--bad)}.fbhead b{color:var(--amber2);text-decoration:underline}
.fbans{font-size:21px;margin:4px 0}.fbans b{color:var(--amber2)}.fbgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:6px;margin:6px 0}.fbgrid>div{padding:6px 10px;border-radius:8px;background:var(--bg2);border-left:3px solid var(--bad)}.fbgrid .ok{border-color:var(--ok)}.fbgrid .half{border-color:var(--half)}
.rule{margin:12px 0 4px;padding:10px 12px;background:var(--bg2);border-radius:10px;border:1px dashed var(--line)}.formula{color:var(--amber2);font-family:ui-monospace,Menlo,monospace;font-size:15px}.formula.big{font-size:17px;margin:6px 0}
.whybox{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0;font-size:16px}
.calnote{color:var(--amber2)}.calsum{margin:14px 0;padding:10px 14px;background:var(--bg2);border-radius:12px;border:1px solid var(--line)}.amber{color:var(--amber2)}
.gm{color:var(--m);font-weight:700}.gf{color:var(--f);font-weight:700}
.flash{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:28px 16px;text-align:center;margin:10px 0}.fw{font-size:34px;font-weight:600}.fen{font-size:24px;color:var(--mute);margin-top:6px}#fback{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.grades .btn{padding:10px 4px;text-align:center}.g1{background:#4a2420;border-color:#8a3f37}.g2{background:#4a3d1c;border-color:#8a742f}.g3{background:#1f4a2c;border-color:#2e7a45}.g4{background:#1a4a45;border-color:#2e8a80}
.mini{font-size:16px;background:transparent;border:1px solid var(--line);border-radius:8px;color:var(--text);cursor:pointer;padding:0 8px}.bigspk{font:inherit;font-size:22px;padding:16px 26px;border-radius:14px;background:var(--panel);color:var(--amber2);border:2px solid var(--amber);cursor:pointer}
.passage{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--amber);border-radius:12px;padding:12px 16px;margin:8px 0 14px;line-height:1.9;font-size:18px}.ptitle{font-weight:700;color:var(--amber2);margin-bottom:2px}.passage p{margin:0}
.qq{font-weight:600}
.clock{width:120px;height:120px;color:var(--text);display:block;margin:4px auto}.prompt .big{text-align:center}
.built{min-height:56px;border:2px dashed var(--line);border-radius:12px;padding:8px;margin:8px 0;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tiles{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.tile{font:inherit;font-size:19px;color:var(--text);background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer}.tile.on{border-color:var(--amber)}.tile.used{opacity:.3}.tile:hover:not(.used){border-color:var(--amber)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px;margin:8px 0}.cell{display:flex;align-items:center;gap:6px}.cell .pl{min-width:4.2em;text-align:right}.cell input.inl{width:100%;margin:0;text-align:left}
.sflash{font-size:24px;font-weight:700;margin:16px 0}.sflash.ok{color:var(--ok)}.sflash.bad{color:var(--bad)}.card.spr{border-top:3px solid var(--bad)}
.sumh{font-size:14px;text-transform:uppercase;letter-spacing:.1em;color:var(--amber)}.sum .big{font-size:32px;font-weight:700;margin:4px 0}.refl{margin-top:18px}.refl label{font-weight:600}.flav{margin-top:14px;font-style:italic}
#acc{position:fixed;left:0;right:0;bottom:0;background:rgba(11,23,16,.96);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));display:flex;justify-content:center;flex-wrap:wrap;gap:6px;z-index:6}#acc[hidden]{display:none}
.acc{font:inherit;font-size:20px;min-width:38px;height:42px;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:9px;cursor:pointer}
#pause{position:fixed;inset:0;background:rgba(5,12,8,.88);z-index:20;overflow:auto;padding:20px 16px}#pause[hidden]{display:none}
.pbox{max-width:560px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px}.pbox h2{margin:0 0 4px;color:var(--amber2)}.pbox label{display:block;margin:14px 0 4px;color:var(--mute);font-size:15px}
select,textarea{width:100%;font:inherit;font-size:17px;color:var(--text);background:var(--bg2);border:2px solid var(--line);border-radius:10px;padding:8px}textarea{min-height:90px;font-size:13px;font-family:ui-monospace,Menlo,monospace}
.prow{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
@media(max-width:520px){body{font-size:17px}.big{font-size:21px}.fw{font-size:28px}.choices.row{grid-template-columns:1fr}input.inl{width:8em}}
</style>

<body>
<div id="top"><div class="row"><button id="pauseBtn" aria-label="Pause and settings" title="Pause / settings (Esc)">⏸</button><div id="info"></div></div><div id="meter"><div id="bar"></div></div></div>
<main id="card" class="card"></main>
<div id="acc" hidden></div>
<div id="pause" hidden><div class="pbox"><h2>⏸ Pause</h2><div class="sub">The timer is stopped. Esc to resume.</div>
<label for="setWatched">I've watched up to…</label><select id="setWatched"></select>
<label for="setItems">Items per expedition</label><select id="setItems"><option value="10">10 items</option><option value="15">15 items</option><option value="25">25 items</option></select>
<label for="setMins">Time box per expedition</label><select id="setMins"><option value="3">3 minutes</option><option value="5">5 minutes</option><option value="8">8 minutes</option></select>
<div class="prow"><button id="resumeBtn" class="btn primary">Resume ↵</button></div>
<label for="xfer">Progress: export, import or reset</label><textarea id="xfer" spellcheck="false" placeholder="Export fills this box. To import, paste an export here."></textarea>
<div class="prow"><button id="exportBtn" class="btn">Export</button><button id="importBtn" class="btn">Import</button><button id="resetBtn" class="btn ghost">Reset all progress</button></div><div id="xmsg" class="sub"></div></div></div>
<script>
(function(){'use strict';
/* ===== DATA: one big object grouped by episode (1-12). Text blocks: fields split by |, alternatives by ; ===== */
var DATA={};for(var i=1;i<=12;i++)DATA[i]={tr:[],fill:[],agree:[],fix:[],rs:[],gap:[],voc:[],pas:[]};
function _L(s){return s.split('\n').map(function(x){return x.trim()}).filter(Boolean)}
function _A(s){return(s||'').split(';').map(function(x){return x.trim()}).filter(Boolean)}
function EP(n,o){var D=DATA[n];
 if(o.tr)_L(o.tr).forEach(function(l){var p=l.split('|');D.tr.push({en:p[0],a:_A(p[1]),tag:p[2]})});
 ['fill','agree'].forEach(function(k){if(o[k])_L(o[k]).forEach(function(l){var p=l.split('|');D[k].push({q:p[0],a:_A(p[1]),tag:p[2],note:p[3]||'',en:p[4]||''})})});
 if(o.fix)_L(o.fix).forEach(function(l){var p=l.split('|');D.fix.push({q:p[0],a:_A(p[1]),tag:p[2]})});
 if(o.rs)_L(o.rs).forEach(function(l){var p=l.split('|');D.rs.push({q:p[0],o:p[1].split('~'),tag:p[2]})});
 if(o.gap)_L(o.gap).forEach(function(l){var p=l.split('|');D.gap.push({who:p[0],q:p[1],a:_A(p[2]),en:p[3]||'',tag:p[4]||'etre'})});
 if(o.voc)_L(o.voc).forEach(function(l){var p=l.split('|');D.voc.push({g:p[0],fr:p[1],en:p[2],cat:p[3]})});
}
/* passages: @title|char then  fr|en lines (blanks as [[word]]), ?vf|statement|V/F  ?mc|question|right~wrong~wrong  ?ty|question|answer;alt */
function PAS(n,s){var cur=null;_L(s).forEach(function(l){
 if(l[0]==='@'){var p=l.slice(1).split('|');cur={title:p[0],ch:p[1],s:[],q:[]};DATA[n].pas.push(cur)}
 else if(l[0]==='?'){var p=l.slice(1).split('|');cur.q.push({t:p[0],q:p[1],a:p[2]})}
 else{var p=l.split('|');cur.s.push({fr:p[0],en:p[1]||''})}})}
/* grammar notes per tag: char | short label | formula | explanation */
var WHY={};
(function(t){_L(t).forEach(function(l){var p=l.split('|');WHY[p[0]]={c:p[1],k:p[2],f:p[3],t:p[4]}})})(`
etre|ellie|être|je suis · tu es · il/elle est · nous sommes · vous êtes · ils/elles sont|être (to be) is irregular, so learn the six forms as a song. Tip: "tu es" and "il est" sound the same (è).
pron|ellie|pronouns|je · tu · il/elle/on · nous · vous · ils/elles|Subject pronouns tell you who does the verb. on = we (informal). ils covers a mixed group, elles only women.
tuvous|ellie|tu or vous|tu = one friend or child · vous = polite OR several people|When in doubt, use vous. In the park they all say tu to you, Ashok, because you are colleagues.
job|ellie|jobs|Je suis + MÉTIER (no un/une)|After être, a job takes no article: Je suis ingénieur. English says "an engineer", French does not.
nat|ellie|nationality|masculine + e = feminine · belge stays belge|Nationalities agree with the person (indien → indienne) and have no capital letter.
jappelle|ellie|je m'appelle|je m'appelle + NOM|Learn it as one block. It literally means "I call myself".
jhabite|ellie|j'habite|j'habite + en + pays (feminine)|je becomes j' before a vowel or a silent h. Feminine countries take en.
cava|ellie|ça va ?|Comment ça va ? → Ça va (bien), merci. Et toi / Et vous ?|Give the question back: Et toi ? (friend) or Et vous ? (polite).
elis|ellie|elision|je → j' · le/la → l' · de → d' · ne → n' (before a vowel or silent h)|French avoids two vowels meeting, so the first word loses its vowel and takes an apostrophe.
irreg|malcolm|chaos!|irregular = no pattern, just memorise|Malcolm: chaos has patterns, but this verb does not follow them. Sing it ten times a day.
avoir|ellie|avoir|j'ai · tu as · il/elle a · nous avons · vous avez · ils/elles ont|avoir (to have). Careful: il a (has) vs il y a (there is).
gender|ellie|gender|le dinosaure (m, blue) · la queue (f, red)|Every noun is masculine or feminine. Learn the article together with the noun, always.
art|ellie|articles|un / une → des · le / la → les · le/la + voyelle → l'|un/une = a, le/la = the. In the plural both become des / les.
elisl|ellie|l'|le / la + voyelle → l' (l'œuf, l'île)|Before a vowel or silent h, le and la become l'. You cannot hear the gender any more, so learn it with the noun.
ilya|hammond|il y a|il y a + nom (singular or plural)|il y a = there is / there are. One form for singular and plural. Never ils y ont!
age|malcolm|age|j'ai + nombre + ans|In English you ARE 35. In French you HAVE 35 years: j'ai 35 ans.
peur|malcolm|avoir peur|j'ai peur = I have fear|Feelings use avoir, not être: j'ai peur, j'ai froid, j'ai faim.
num20|hammond|numbers 0-20|zéro un deux trois quatre cinq six sept huit neuf dix onze douze treize quatorze quinze seize dix-sept dix-huit dix-neuf vingt|Learn 0 to 16 as separate words. After that it is dix + number.
agree|ellie|agreement|adjectif + e (fem.) · + s (plur.) · + es (fem. plur.)|The adjective matches the noun: grand → grande → grands → grandes. Final -s, -t, -d are silent in the masculine.
agr2|malcolm|chaos endings|-eux → -euse · -if → -ive · -ien → -ienne · blanc → blanche · vieux → vieille|Some adjective endings change in the feminine. Malcolm: chaos with a pattern.
pos|ellie|position|noun + adjective, EXCEPT BAGS: beauté, âge, bonté, grandeur|Most adjectives come after the noun (une plante verte). BAGS adjectives come before: beau, jeune, vieux, bon, mauvais, petit, grand, joli, nouveau.
cest|ellie|c'est / il est|c'est + un/une + nom · il/elle est + adjectif · il est + métier|c'est introduces a noun with an article; il est goes with an adjective or a job without article.
num100|hammond|numbers 20-100|vingt trente quarante cinquante soixante · soixante-dix (septante) · quatre-vingts · quatre-vingt-dix (nonante) · cent|In Belgium it is simpler: septante (70) and nonante (90). Useful for you in Genk!
colors|ellie|colours|vert · rouge · bleu · jaune · noir · blanc · gris · marron (invariable)|Colours are adjectives and agree (verte, blanche), but marron never changes.
er|ellie|-er verbs|radical + e · es · e · ons · ez · ent|Four forms sound the same: je mange, tu manges, il mange, ils mangent (endings -e, -es, -ent are silent).
er2|malcolm|little chaos|manger → nous mangeons (keep the e) · aimer → j'aime|With nous, manger keeps its e so that the g stays soft. Je becomes j' before a vowel.
neg|ellie|negation|ne + VERBE + pas (n' before a vowel)|Negation works like brackets around the verb: je ne mange pas, je n'aime pas.
negde|malcolm|pas de|après pas : un / une / des → de|Je mange des plantes → Je ne mange pas de plantes. (le/la/les stay: je n'aime pas la viande.)
aimer|ellie|aimer + le/la/les|j'aime + le / la / les|After aimer, adorer, détester you use the definite article: j'aime les dinosaures.
quest|ellie|questions|Tu aimes ? · Est-ce que tu aimes ? · mot interrogatif + est-ce que|Three ways to ask: intonation, est-ce que, or a question word (où, quand, comment, pourquoi, combien, qui, qu'est-ce que).
aller|malcolm|aller|vais · vas · va · allons · allez · vont|Irregular: the chaos club. Learn aller, faire, venir and prendre by heart.
faire|malcolm|faire|fais · fais · fait · faisons · faites · font|Irregular. Note vous faites and ils font.
venir|malcolm|venir|viens · viens · vient · venons · venez · viennent|Irregular. Je viens de + origine.
prendre|malcolm|prendre|prends · prends · prend · prenons · prenez · prennent|Irregular. prendre = to take / to have (a coffee).
contr|ellie|à / de + le|à + le = au · à + les = aux · de + le = du · de + les = des|Only le and les contract. à la and à l' stay as they are.
country|ellie|countries|en + fem. · au + masc. · aux + plur. | venir : de / d' / du / des|Je vais en Belgique, au Canada, aux États-Unis. Je viens de France, d'Inde, du Canada.
prep|ellie|position|devant · derrière · dans · sur · sous · à côté de · entre · en face de|Position words. With à côté de / en face de, the contraction applies: à côté du restaurant.
time|hammond|time|Il est … heure(s) · et quart · et demie · moins le quart · midi · minuit|Il est une heure, deux heures. Quarter past = et quart, half past = et demie, quarter to = moins le quart.
fproche|ellie|futur proche|aller (présent) + INFINITIF|Je vais manger, nous allons partir. Negative: je ne vais pas manger.
imper|ellie|imperative|tu / nous / vous form without the pronoun|Regarde ! Regardons ! Regardez ! The -er verbs lose the s in the tu form.
imper2|malcolm|chaos commands|Viens ! · Cours ! · Reste ici ! · Allons-y ! · Ne bouge pas !|Negative commands wrap the verb: ne + VERBE + pas.
faut|ellie|il faut|il faut + INFINITIF|il faut = you have to / one must. It never changes: Il faut courir.
weather|ellie|weather|il fait beau/mauvais/chaud/froid · il pleut · il y a du vent|Weather uses il fait + adjective, or special verbs like il pleut.
feel|malcolm|feelings|avoir peur / froid / chaud / faim / soif|Feelings use avoir, not être. In English you ARE cold; in French you HAVE cold.
refl|ellie|reflexive|SUJET + me/te/se/nous/vous/se + VERBE|The pronoun matches the subject: je me lève, tu te lèves, il se lève. You already knew one: je m'appelle!
reflneg|ellie|reflexive neg.|je ne me lève pas|The negation brackets go around the pronoun and the verb: ne + me lève + pas.
routine|claire|routine|d'abord · ensuite · après · enfin · tôt · tard · jamais|Claire's routine words put your day in order: d'abord, ensuite, après, enfin.
partit|ellie|partitive|du (m) · de la (f) · de l' (voyelle) · des (plur.) · pas de|Use it for an unknown amount of something. After a negation everything becomes de: pas de café.
quant|ellie|quantity|beaucoup de · un peu de · assez de · trop de · une tasse de|After a quantity word you use de only, never du/de la/des.
boire|malcolm|boire|bois · bois · boit · buvons · buvez · boivent|Malcolm: chaos in a glass. The stem changes: boi- / buv- / boiv-.
vous2|claire|vous|vous = politeness, strangers, bosses, groups|With vous the verb has the -ez form (vous êtes, vous avez, vous parlez) and adjectives stay singular for one person.
bignum|hammond|big numbers|mille (never mills) · deux mille · un million · deux millions|mille never takes an s: deux mille. Million is a noun: un million, deux millions d'années.
pvd|malcolm|pouvoir · vouloir · devoir|peux · veux · dois (je, tu) · peut · veut · doit · pouvons · voulons · devons|All three are irregular and take an infinitive: Je peux entrer. Tu veux voir Blue ? Nous devons attendre.
irre|ellie|-ir and -re|finir: finis, finit, finissons · attendre: attends, attend, attendons|Two more regular families. -ir verbs add -iss- in the plural; -re verbs drop the ending.
compar|ellie|comparison|plus / moins / aussi + ADJ + que|Le T. rex est plus grand que le raptor. Before a vowel que becomes qu'.
superl|ellie|superlative|le / la / les plus + ADJ|Blue est la plus intelligente. The article and adjective agree with the noun.
meill|malcolm|meilleur|bon → meilleur (not plus bon)|Malcolm: the exception. bon / bonne → meilleur / meilleure.

function accUpdate(){var show=!!($('#ans')||$('#g0')||$('#cz0')||$('#refl'));accBar.hidden=!show||R.phase==='fb'}
/* ===== events ===== */
function setupEvents(){
 document.addEventListener('focusin',function(e){var t=e.target;if(t&&t.tagName==='INPUT')R.focus=t});
 var ac='éèêàùâçôîûëïœ'.split('');accBar.innerHTML=ac.map(function(c){return'<button type="button" class="acc" data-c="'+c+'">'+c+'</button>'}).join('');
 function ins(c){var el=R.focus&&document.body.contains(R.focus)&&!R.focus.disabled?R.focus:($('#ans')||$('#cz0')||$('#g0')||$('#refl'));if(!el)return;var s=el.selectionStart==null?el.value.length:el.selectionStart,e=el.selectionEnd==null?s:el.selectionEnd;el.value=el.value.slice(0,s)+c+el.value.slice(e);el.setSelectionRange(s+1,s+1);el.focus()}
 ['mousedown','touchstart'].forEach(function(ev){accBar.addEventListener(ev,function(e){var b=e.target.closest('.acc');if(!b)return;e.preventDefault();ins(b.getAttribute('data-c'))},{passive:false})});
 document.addEventListener('keydown',function(e){
  if(R.paused){if(e.key==='Escape'){e.preventDefault();closePause()}return}
  if(e.key==='Escape'){e.preventDefault();openPause();return}
  var tg=e.target,inp=tg&&(tg.tagName==='INPUT'||tg.tagName==='TEXTAREA'||tg.tagName==='SELECT');
  if(R.phase==='sum'){if(e.key==='Enter'&&tg&&tg.id!=='refl'){}if(e.key==='Enter'&&tg&&tg.id==='refl'){e.preventDefault();saveRefl()}return}
  if(inp){
   if(e.key==='Enter'&&R.phase==='ask'){e.preventDefault();var cls=tg.className;if(/\bgi\b/.test(cls)||/\bcz\b/.test(cls)){var all=$$(/\bgi\b/.test(cls)?'.gi':'.cz'),i=all.indexOf(tg);if(i<all.length-1){all[i+1].focus();return}}submit();return}
   if(e.key==='Tab'&&R.phase==='ask'&&R.cur&&R.cur._kind==='text'&&R.kind==='normal'){e.preventDefault();hint()}
   return}
  var k=e.key,it=R.cur;
  if(R.phase==='cal'){if(k==='1'||k==='2'||k==='3'){R.conf=['sure','unsure','guess'][+k-1];e.preventDefault();$('#fb').innerHTML='';finish(evaluate(it,R.val))}return}
  if(R.phase==='fb'){if(R.kind==='sprint')return;if(k==='Enter'||k===' '){e.preventDefault();nextItem()}else if(k==='w'||k==='W')toggleExtra('why');else if(k==='s'||k==='S')toggleExtra('stats');else if(k==='l'||k==='L')say();return}
  if(R.phase==='flip'){if(/^[1-4]$/.test(k)){grade(['again','hard','good','easy'][+k-1])}return}
  if(R.phase==='ask'&&it){
   if(it.type==='flash'&&(k==='Enter'||k===' ')){e.preventDefault();flip();return}
   if(it._kind==='choice'&&/^[1-9]$/.test(k)){choose(+k-1);return}
   if(it._kind==='build'){if(/^[1-9]$/.test(k)){addTile(+k-1)}else if(k==='Backspace'){R.sel.pop();renderBuild()}else if(k==='Enter'){e.preventDefault();submit()}else if(k==='h'||k==='H')hint()}
   if(it.type==='rq'&&it.qt==='vf'){if(k==='v'||k==='V')choose(0);if(k==='f'||k==='F')choose(1)}}
 });
 document.addEventListener('click',function(e){var t=e.target.closest('[data-act],[data-i],[data-cal],[data-grade],[data-t],[data-un]');if(!t)return;
  var act=t.getAttribute('data-act');
  if(t.hasAttribute('data-i')&&R.cur&&R.cur._kind==='choice'){choose(+t.getAttribute('data-i'));return}
  if(t.hasAttribute('data-cal')){R.conf=t.getAttribute('data-cal');$('#fb').innerHTML='';finish(evaluate(R.cur,R.val));return}
  if(t.hasAttribute('data-grade')){grade(t.getAttribute('data-grade'));return}
  if(t.hasAttribute('data-t')){addTile(+t.getAttribute('data-t'));return}
  if(t.hasAttribute('data-un')){R.sel.splice(+t.getAttribute('data-un'),1);renderBuild();return}
  if(act==='check')submit();else if(act==='hint')hint();else if(act==='next')nextItem();else if(act==='why')toggleExtra('why');else if(act==='stats')toggleExtra('stats');
  else if(act==='say')say();else if(act==='readp'){if(!speak(R.cur.p.s.map(function(s){return strip(s.fr)}).join(' ')))noVoice()}
  else if(act==='flip')flip();else if(act==='saver')saveRefl();else if(act==='skipr')startRound()});
 $('#pauseBtn').addEventListener('click',function(){R.paused?closePause():openPause()});
 $('#resumeBtn').addEventListener('click',closePause);
 $('#pause').addEventListener('click',function(e){if(e.target.id==='pause')closePause()});
 $('#setWatched').addEventListener('change',function(){S.set.watched=+this.value;save()});
 $('#setItems').addEventListener('change',function(){S.set.items=+this.value;save()});
 $('#setMins').addEventListener('change',function(){S.set.mins=+this.value;save()});
 $('#exportBtn').addEventListener('click',function(){var j=JSON.stringify(S);$('#xfer').value=j;$('#xfer').select();var ok=false;try{ok=document.execCommand('copy')}catch(e){}$('#xmsg').textContent=ok?'Exported and copied. Paste it somewhere safe.':'Exported: select all and copy this text.'});
 $('#importBtn').addEventListener('click',function(){try{var o=JSON.parse($('#xfer').value);if(!o||o.v!==1||typeof o.it!=='object')throw 0;S=Object.assign(newState(),o);save();$('#xmsg').textContent='Imported. Progress restored.'}catch(e){$('#xmsg').textContent='That text is not a valid export.'}});
 $('#resetBtn').addEventListener('click',function(){if(this.dataset.arm!=='1'){this.dataset.arm='1';this.textContent='Click again to erase everything';var b=this;setTimeout(function(){b.dataset.arm='0';b.textContent='Reset all progress'},4000)}else{this.dataset.arm='0';S=newState();save();CARRY=[];$('#xmsg').textContent='Progress erased.';this.textContent='Reset all progress'}});
 window.addEventListener('beforeunload',save)}
function addTile(i){if(R.phase!=='ask')return;var x=R.cur._tiles[i];if(!x||R.sel.indexOf(x)>=0)return;R.sel.push(x);renderBuild()}
function say(){var t=speakText(R.cur);if(!t){noVoice();return}if(!speak(t))noVoice()}
function noVoice(){var h=$('#hint')||$('#extra');if(h){h.hidden=false;h.innerHTML='No French voice found on this device (the 🔊 button needs one).'}}
function toggleExtra(w){var ex=$('#extra');if(!ex)return;var cur=ex.getAttribute('data-w');if(cur===w){ex.innerHTML='';ex.removeAttribute('data-w');return}ex.setAttribute('data-w',w);ex.innerHTML=w==='why'?whyHTML(R.cur):statsHTML(R.cur)}
/* ===== boot ===== */
function boot(){card=$('#card');topInfo=$('#info');bar=$('#bar');accBar=$('#acc');setupEvents();startRound()}
window.FJ={ITEMS:ITEMS,S:function(){return S},R:R,evaluate:evaluate,build:build,showItem:showItem,cmp:cmp,norm:norm,nextItem:nextItem,finish:finish,startRound:startRound,pickNormal:pickNormal,set:function(k,v){S.set[k]=v},VERBS:VERBS};
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
})();
