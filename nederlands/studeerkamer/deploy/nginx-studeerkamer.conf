# Reference nginx site for nederlands.yaal.be.
# The GitHub Actions workflow writes this exact config to
# /etc/nginx/sites-available/studeerkamer on the box — kept here for
# manual restoration / inspection.
#
# Topology: Cloudflare (TLS terminator) → origin :80 → uvicorn :15191
# Cloudflare SSL/TLS mode MUST be "Full" (not Flexible) so origin sees
# https-style cookies as secure.

server {
    listen 80;
    server_name nederlands.yaal.be;

    client_max_body_size 50m;

    # Real client IP from Cloudflare's published ranges.
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2c0f:f248::/32;
    set_real_ip_from 2a06:98c0::/29;
    real_ip_header CF-Connecting-IP;

    # Static assets: always revalidate (cheap 304s via FastAPI ETag).
    # Ensures Cloudflare + browser pick up deploys without manual purges.
    location /static/ {
        proxy_pass http://127.0.0.1:15191;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    # Service worker MUST NEVER be cached — caching it breaks PWA updates.
    location = /service-worker.js {
        proxy_pass http://127.0.0.1:15191;
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # PWA manifest.
    location = /manifest.webmanifest {
        proxy_pass http://127.0.0.1:15191;
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    # App shell + /api/* + /login. FastAPI sets its own Cache-Control where
    # appropriate (e.g. /api/audio uses session-scoped responses CF won't cache).
    location / {
        proxy_pass http://127.0.0.1:15191;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
