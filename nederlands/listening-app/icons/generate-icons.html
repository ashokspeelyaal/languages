<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Icoongenerator · Icon generator</title>
<style>
  body { font: 16px/1.5 -apple-system, system-ui, sans-serif; background: #f5efe1; color: #1b1813; max-width: 800px; margin: 2rem auto; padding: 1rem; }
  h1 { font-weight: 600; }
  p { color: #5a5347; }
  button { font: inherit; padding: .7rem 1.3rem; background: #9a3a2c; color: white; border: 0; border-radius: 6px; cursor: pointer; font-weight: 600; }
  button:hover { filter: brightness(1.08); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 1rem; margin-top: 1.5rem; }
  .cell { background: #fffdf6; border: 1px solid #e6dcc1; border-radius: 6px; padding: 1rem; text-align: center; }
  .cell canvas { max-width: 100%; height: auto; image-rendering: -webkit-optimize-contrast; border: 1px dashed #cdbf9d; }
  .cell p { margin: .4rem 0; font-size: .85rem; }
  .cell a { display: inline-block; margin-top: .4rem; color: #1f4775; }
  .row { display: flex; gap: .5rem; align-items: center; margin-bottom: 1rem; }
  code { background: #fbf6e9; padding: 2px 6px; border-radius: 3px; font-family: ui-monospace, monospace; }
</style>
</head>
<body>

<h1>Icoongenerator</h1>
<p>Klik <strong>Genereer alle</strong>, dan zie je elke icoongrootte hieronder verschijnen. Klik per icoon op <strong>Download</strong> om het op te slaan in deze map (<code>icons/</code>).</p>

<div class="row">
  <button id="go">Genereer alle</button>
  <button id="dlAll" style="background:#1f4775">Download alle</button>
  <span id="status" style="color:#9b9384;font-style:italic"></span>
</div>

<div class="grid" id="grid"></div>

<script>
const SIZES = [
  { name: "icon-180.png", size: 180, mask: false }, // apple-touch-icon
  { name: "icon-167.png", size: 167, mask: false }, // iPad Pro
  { name: "icon-152.png", size: 152, mask: false }, // iPad
  { name: "icon-192.png", size: 192, mask: false }, // PWA manifest
  { name: "icon-512.png", size: 512, mask: false }, // PWA manifest
  { name: "icon-192-maskable.png", size: 192, mask: true }, // PWA maskable
  { name: "icon-512-maskable.png", size: 512, mask: true }, // PWA maskable
];

// Inline SVG matching icons/icon.svg, kept here so the generator is self-contained.
const SVG = `
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="112" ry="112" fill="#f5efe1"/>
  <rect x="22" y="22" width="468" height="468" rx="96" ry="96"
        fill="none" stroke="#e6dcc1" stroke-width="2"/>
  <g fill="none" stroke="#9a3a2c" stroke-width="22" stroke-linecap="round">
    <path d="M 220 196 a 84 84 0 0 1 0 120"/>
    <path d="M 256 156 a 140 140 0 0 1 0 200"/>
    <path d="M 290 116 a 196 196 0 0 1 0 280"/>
  </g>
  <path d="M 168 168 L 168 344 L 312 256 Z" fill="#1b1813"/>
  <circle cx="412" cy="100" r="14" fill="#1f4775"/>
</svg>`;

// Maskable variant: solid background extends to corners (Android adaptive icon safe zone)
const SVG_MASK = `
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#9a3a2c"/>
  <g transform="translate(96 96) scale(0.625)">
    <rect width="512" height="512" rx="112" ry="112" fill="#f5efe1"/>
    <g fill="none" stroke="#9a3a2c" stroke-width="22" stroke-linecap="round">
      <path d="M 220 196 a 84 84 0 0 1 0 120"/>
      <path d="M 256 156 a 140 140 0 0 1 0 200"/>
      <path d="M 290 116 a 196 196 0 0 1 0 280"/>
    </g>
    <path d="M 168 168 L 168 344 L 312 256 Z" fill="#1b1813"/>
  </g>
</svg>`;

const grid = document.getElementById("grid");
const status = document.getElementById("status");
const cells = [];

async function svgToPng(svgText, size) {
  return new Promise((resolve, reject) => {
    const blob = new Blob([svgText], { type: "image/svg+xml" });
    const url = URL.createObjectURL(blob);
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement("canvas");
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, size, size);
      URL.revokeObjectURL(url);
      canvas.toBlob((blob) => resolve({ canvas, blob }), "image/png");
    };
    img.onerror = reject;
    img.src = url;
  });
}

document.getElementById("go").addEventListener("click", async () => {
  status.textContent = "genereren…";
  grid.innerHTML = "";
  cells.length = 0;
  for (const spec of SIZES) {
    const { canvas, blob } = await svgToPng(spec.mask ? SVG_MASK : SVG, spec.size);
    const cell = document.createElement("div");
    cell.className = "cell";
    cell.appendChild(canvas);
    const label = document.createElement("p");
    label.innerHTML = "<code>" + spec.name + "</code> · " + spec.size + "×" + spec.size + (spec.mask ? " · maskable" : "");
    cell.appendChild(label);
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = spec.name;
    a.textContent = "Download";
    cell.appendChild(a);
    grid.appendChild(cell);
    cells.push({ spec, blob, url });
  }
  status.textContent = "klaar — klik nu op elk Download of op de blauwe knop voor alle.";
});

document.getElementById("dlAll").addEventListener("click", () => {
  if (!cells.length) { status.textContent = "klik eerst op Genereer alle."; return; }
  cells.forEach((c, i) => {
    setTimeout(() => {
      const a = document.createElement("a");
      a.href = c.url;
      a.download = c.spec.name;
      document.body.appendChild(a);
      a.click();
      a.remove();
    }, i * 150);
  });
});
</script>

</body>
</html>
